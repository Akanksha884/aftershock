<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AFTERSHOCK</title>
<style>.gtree{display:none;margin-left:12px;border-left:1px solid var(--bd);padding-left:12px}.gt{border-left:3px solid;background:var(--c2);margin:8px 0;padding:8px 10px;border-radius:6px;cursor:pointer}@media(max-width:600px){.gsvg{display:none}.gtree{display:block}}.gn{cursor:pointer}.gn:hover line{opacity:1!important;stroke-width:2.2}.gn:focus{outline:none}.gn:focus circle:nth-of-type(2){stroke-width:4}
:root{--bg:#090B0F;--bg2:#0E1218;--c1:#151A22;--c2:#1A2029;--bd:#28313C;--t:#F2F4F7;--t2:#929CAA;--t3:#626B78;--am:#FF9F43;--red:#FF4D5A;--ok:#38D39F;--info:#55C2FF}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px/1.5 Inter,Manrope,system-ui,sans-serif}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
header{display:flex;align-items:center;gap:20px;padding:14px 24px;border-bottom:1px solid var(--bd);background:var(--bg2)}
.brand{font-weight:800;letter-spacing:.14em;display:flex;align-items:center;gap:10px}
nav{display:flex;gap:4px;flex:1}nav button{background:none;border:0;color:var(--t2);padding:6px 12px;border-radius:8px;cursor:pointer;font:inherit}
nav button.on,nav button:hover{color:var(--t);background:var(--c1)}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--am);outline-offset:2px}
main{max-width:1180px;margin:0 auto;padding:28px 24px}h1{font-size:28px;margin:0 0 4px}h2{font-size:12px;letter-spacing:.12em;color:var(--t2);margin:0 0 12px}
.sub{color:var(--t2);margin:0 0 24px}.grid{display:grid;grid-template-columns:2fr 1fr;gap:20px}@media(max-width:860px){.grid{grid-template-columns:1fr}}
.card{background:var(--c1);border:1px solid var(--bd);border-radius:12px;padding:18px;margin-bottom:16px;transition:border-color .2s,transform .2s}
.card.hover:hover{border-color:var(--am);transform:translateY(-2px);cursor:pointer}
.btn{background:var(--am);color:#1a1100;border:0;border-radius:8px;padding:9px 16px;font-weight:700;cursor:pointer;font:inherit;font-weight:700}
.btn.ghost{background:transparent;color:var(--t);border:1px solid var(--bd)}.btn:hover{filter:brightness(1.08)}
input,textarea,select{width:100%;background:var(--bg2);color:var(--t);border:1px solid var(--bd);border-radius:8px;padding:10px;font:inherit;margin-bottom:10px}
textarea{min-height:140px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tag{font:600 11px ui-monospace,monospace;letter-spacing:.06em;padding:2px 8px;border-radius:99px;border:1px solid var(--bd);color:var(--t2)}
.s-COMPLETED{color:var(--ok);border-color:var(--ok)}.s-WAITING_APPROVAL{color:var(--am);border-color:var(--am)}.s-MONITORING{color:var(--info);border-color:var(--info)}
.s-REJECTED,.s-FAILED{color:var(--red);border-color:var(--red)}
.tl{border-left:1px solid var(--bd);margin-left:6px}.tl>div{padding:6px 0 10px 16px;position:relative;transition:opacity .3s}
.tl>div:before{content:"";position:absolute;left:-5px;top:12px;width:9px;height:9px;border-radius:50%;background:var(--t3)}
.tl .COMPLETED:before{background:var(--ok)}.tl .WAITING_APPROVAL:before{background:var(--am)}.tl .MONITORING:before{background:var(--info)}.tl .REJECTED:before,.tl .FAILED:before{background:var(--red)}
.approval{border:1px solid var(--am);background:linear-gradient(180deg,#1d1710,var(--c1))}.approval small{color:var(--am);letter-spacing:.12em;font-weight:700}
.log{max-height:260px;overflow:auto;color:var(--t2)}.log b{color:var(--t3);font-weight:400;margin-right:8px}
.bar{height:4px;background:var(--bd);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--am);transition:width .6s}
.sim{color:var(--info);font:600 10px ui-monospace,monospace;letter-spacing:.1em}
.ring circle{transition:stroke-dashoffset .8s ease}.toast{position:fixed;right:20px;bottom:20px;background:var(--c2);border:1px solid var(--am);border-radius:10px;padding:12px 16px;animation:in .3s}
@keyframes in{from{opacity:0;transform:translateY(10px)}}.err{color:var(--red)}
</style></head><body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s), api=async(p,o={})=>{const h={...(o.headers||{})};const t=localStorage.token;if(t)h.Authorization="Bearer "+t;if(o.json){h["Content-Type"]="application/json";o.body=JSON.stringify(o.json)}
 const r=await fetch(p,{...o,headers:h});if(r.status===401&&p!=="/auth/login"){localStorage.clear();render()}
 const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.detail||r.statusText);return d};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let S={tab:"dashboard",inc:null,timer:null,notes:[]};
const ago=d=>new Date(d+"Z").toLocaleTimeString();
const label=s=>s.replaceAll("_"," ");
const logo=`<svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="#FF9F43" stroke-width="1.6" aria-hidden="true"><circle cx="13" cy="13" r="3" fill="#FF9F43"/><circle cx="13" cy="13" r="7" opacity=".7"/><circle cx="13" cy="13" r="11" opacity=".4"/></svg>`;

function ring(p){const r=54,c=2*Math.PI*r;return `<svg class="ring" width="140" height="140" role="img" aria-label="Recovery progress ${p.percent}%"><circle cx="70" cy="70" r="${r}" stroke="#28313C" stroke-width="8" fill="none"/><circle cx="70" cy="70" r="${r}" stroke="#FF9F43" stroke-width="8" fill="none" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p.percent/100)}" transform="rotate(-90 70 70)"/><text x="70" y="68" fill="#F2F4F7" font-size="28" font-weight="800" text-anchor="middle">${p.percent}%</text><text x="70" y="88" fill="#929CAA" font-size="10" text-anchor="middle">${p.addressed} of ${p.total} addressed</text></svg>`}

async function render(){
 const a=$("#app");
 if(!localStorage.token){a.innerHTML=`<main style="max-width:420px;margin-top:10vh"><div class="brand">${logo} AFTERSHOCK</div><h1 style="margin-top:28px">When something goes wrong,<br>know what happens next.</h1><p class="sub">Sign in to continue.</p>
 <input id="em" type="email" aria-label="Email" placeholder="Email" value="demo@aftershock.local"><input id="pw" type="password" aria-label="Password" placeholder="Password">
 <div class="row"><button class="btn" id="li">Sign in</button><button class="btn ghost" id="su">Sign up</button></div><p id="msg" class="err"></p></main>`;
  const go=p=>async()=>{try{const d=await api(p,{method:"POST",json:{email:$("#em").value,password:$("#pw").value}});localStorage.token=d.token;render()}catch(e){$("#msg").textContent=e.message}};
  $("#li").onclick=go("/auth/login");$("#su").onclick=go("/auth/register");return}
 S.notes=await api("/notifications").catch(()=>[]);const unread=S.notes.filter(n=>!n.read).length;
 a.innerHTML=`<header><div class="brand">${logo} AFTERSHOCK</div><nav>${["dashboard","new","assets","documents","settings"].map(t=>`<button class="${S.tab===t?"on":""}" data-t="${t}">${{new:"New incident"}[t]||t[0].toUpperCase()+t.slice(1)}</button>`).join("")}</nav>
 <span class="tag" aria-label="${unread} unread notifications">🔔 ${unread}</span><button class="btn ghost" id="lo">Log out</button></header><main id="m"></main>`;
 a.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;S.inc=null;S.es&&S.es.close();S.es=null;render()});
 $("#lo").onclick=()=>{localStorage.clear();render()};
 await ({dashboard:dash,new:newInc,assets:assets,documents:docs,settings:settings}[S.tab])();
}

async function dash(){
 if(S.inc)return detail();
 const list=await api("/incidents");
 $("#m").innerHTML=`<h1>Here's what needs your attention.</h1><p class="sub">Everything below comes from the live backend.</p>`+(list.length?list.map(i=>`<div class="card hover" data-id="${i.id}" tabindex="0" role="button"><div class="row"><b>${esc(i.type).toUpperCase()}</b><span class="mono" style="color:var(--t3)">INCIDENT #${i.code}</span><span class="tag s-${i.status==="RESOLVED"?"COMPLETED":i.status==="AWAITING_APPROVAL"?"WAITING_APPROVAL":"MONITORING"}">${label(i.status)}</span><span class="tag">${i.severity}</span><span style="margin-left:auto" class="mono">${i.progress.percent}%</span></div>
 <div class="bar" style="margin-top:12px"><i style="width:${i.progress.percent}%"></i></div></div>`).join(""):`<div class="card"><h2>NOTHING HAS GONE WRONG</h2>That's exactly how we like it.</div>`);
 document.querySelectorAll("[data-id]").forEach(c=>{const o=()=>{S.inc=c.dataset.id;render()};c.onclick=o;c.onkeydown=e=>e.key==="Enter"&&o()});
}

async function detail(){
 const [i,acts,log,g,ag]=await Promise.all([api("/incidents/"+S.inc),api(`/incidents/${S.inc}/actions`),api(`/incidents/${S.inc}/activity`),api(`/incidents/${S.inc}/graph`),api(`/incidents/${S.inc}/agents`)]);
 const pend=acts.filter(a=>a.state==="WAITING_APPROVAL");
 $("#m").innerHTML=`<button class="btn ghost" id="bk">← Incidents</button><h1 style="margin-top:16px">${esc(i.type).toUpperCase()} <span class="mono" style="color:var(--t3)">#${i.code}</span></h1>
 <p class="sub">${i.progress.awaiting_approval} require approval · ${i.progress.completed} completed · ${i.progress.monitoring} monitoring · ${i.progress.total} actions identified</p>
 <div class="grid"><div>${pend.map(a=>`<div class="card approval"><small>ACTION REQUIRES YOUR APPROVAL</small><h3 style="margin:6px 0">${esc(a.title)}</h3><p><b>Why:</b> ${esc(a.why)}</p><p><b>Information shared:</b> ${esc(a.shares)||"None"}</p><p><b>Potential consequence:</b> ${esc(a.consequence)}</p><p class="sim">SIMULATED ACTION — nothing external will happen</p>
 <div class="row"><button class="btn" data-ap="${a.id}">Approve Action</button><button class="btn ghost" data-rj="${a.id}">Reject</button></div></div>`).join("")}
 ${graphView(g)}<div class="card"><h2>RECOVERY PLAN</h2><div class="tl">${acts.map(a=>`<div class="${a.state}"><b>${esc(a.title)}</b> <span class="tag s-${a.state}">${a.state==="COMPLETED"?"✓ ":""}${label(a.state)}</span><div class="mono" style="color:var(--t3)">${a.agent}${a.result?.message?" → "+esc(a.result.message):""}</div></div>`).join("")}</div></div></div>
 <div><div class="card" style="text-align:center">${ring(i.progress)}<h2 style="margin-top:8px">RECOVERY PROGRESS</h2></div>
 <div class="card"><h2>WHAT IS AFFECTED</h2>${g.nodes.map(n=>`<div style="margin-bottom:8px"><div class="row" style="justify-content:space-between"><span class="mono">${n.label}</span><span class="tag s-${n.state}">${label(n.state)} · ${n.percent}%</span></div><div class="bar"><i style="width:${n.percent}%"></i></div></div>`).join("")}</div>
 <div class="card"><h2>AGENT ACTIVITY</h2>${ag.map(a=>`<div style="margin-bottom:10px"><b>${esc(a.agent)}</b> <span class="tag s-${a.status==="Completed"?"COMPLETED":a.status==="Needs approval"?"WAITING_APPROVAL":a.status==="Failed"?"FAILED":""}">${a.status}</span><div class="mono" style="color:var(--t3)">${esc(a.task)} · ${ago(a.at)}${a.tools_used.length?"<br>→ "+a.tools_used.join(", "):""}</div></div>`).join("")}<button class="btn ghost" id="mon">Run monitoring check</button></div>
 <details class="card"><summary><b>How AFTERSHOCK reached this plan</b></summary><div class="mono" style="color:var(--t2);margin-top:10px">${ag.map(a=>`${esc(a.agent)}<br>&nbsp;↓ ${esc(a.task)}<br>`).join("")}Human<br>&nbsp;↓ approves consequential actions</div></details>
 <div class="card"><h2>ACTIVITY LOG</h2><div class="log mono">${log.map(e=>`<div><b>${ago(e.at)}</b>${esc(e.message)}</div>`).join("")}</div></div></div></div>`;
 $("#mon").onclick=async()=>{await api(`/incidents/${S.inc}/monitor`,{method:"POST"});toast("Monitoring check complete (simulated)");render()};
 $("#bk").onclick=()=>{S.inc=null;S.es&&S.es.close();S.es=null;render()};
 const act=(sel,verb)=>document.querySelectorAll(sel).forEach(b=>b.onclick=async()=>{b.disabled=true;b.textContent=verb==="approve"?"✓ Approved · executing…":"Rejecting…";
  try{const r=await api(`/actions/${b.dataset.ap||b.dataset.rj}/${verb}`,{method:"POST"});toast(verb==="approve"?"✓ COMPLETED (simulated)":"Rejected — "+r.alternative.title)}catch(e){toast(e.message)}render()});
 bindGraph();act("[data-ap]","approve");act("[data-rj]","reject");
 if(S.es&&S.esFor!==S.inc){S.es.close();S.es=null}
 if(!S.es){S.esFor=S.inc;S.es=new EventSource(`/incidents/${S.inc}/stream?token=${localStorage.token}`);S.es.onmessage=()=>{if(S.inc&&S.tab==="dashboard")detail().catch(()=>{})};S.es.onerror=()=>{}}
}
const COL={COMPLETED:"#38D39F",WAITING_APPROVAL:"#FF9F43",MONITORING:"#55C2FF",REJECTED:"#FF4D5A",FAILED:"#FF4D5A",PROPOSED:"#626B78"};
function graphView(g){
 const n=g.nodes.length,cx=260,cy=150,sel=g.nodes.find(x=>x.id===S.node);
 const pos=g.nodes.map((_,k)=>{const a=2*Math.PI*k/n-Math.PI/2;return [cx+200*Math.cos(a),cy+110*Math.sin(a)]});
 return `<div class="card"><h2>INCIDENT GRAPH</h2><svg class="gsvg" viewBox="0 0 520 300" width="100%" role="group" aria-label="Incident graph">`+
 g.nodes.map((x,k)=>`<g class="gn" tabindex="0" role="button" aria-label="${x.label}: ${label(x.state)}" data-node="${x.id}"><line x1="${cx}" y1="${cy}" x2="${pos[k][0]}" y2="${pos[k][1]}" stroke="${COL[x.state]}" stroke-width="1.2" opacity=".45"/><circle r="4" fill="${COL[x.state]}"><animateMotion dur="${3+k%3}s" repeatCount="indefinite" path="M${cx},${cy} L${pos[k][0]},${pos[k][1]}"/></circle><circle cx="${pos[k][0]}" cy="${pos[k][1]}" r="${sel&&sel.id===x.id?24:20}" fill="#151A22" stroke="${COL[x.state]}" stroke-width="2"/><text x="${pos[k][0]}" y="${pos[k][1]+36}" fill="#929CAA" font-size="10" text-anchor="middle">${x.label}</text></g>`).join("")+
 `<circle cx="${cx}" cy="${cy}" r="30" fill="#FF9F43"/><text x="${cx}" y="${cy+3}" fill="#1a1100" font-size="8" font-weight="800" text-anchor="middle">${esc(g.center).toUpperCase().slice(0,14)}</text></svg><div class="gtree"><div class="tag" style="color:var(--am);border-color:var(--am)">${esc(g.center).toUpperCase()}</div>${g.nodes.map(x=>`<div class="gt" role="button" tabindex="0" data-node="${x.id}" style="border-color:${COL[x.state]}">${x.label} · ${label(x.state)}</div>`).join("")}</div>`+
 (sel?`<div style="border-top:1px solid var(--bd);padding-top:10px"><b>${sel.label}</b> <span class="tag s-${sel.state}">${label(sel.state)}</span>${sel.actions.map(a=>`<p style="margin:6px 0"><b>${esc(a.title)}</b> <span class="tag s-${a.state}">${label(a.state)}</span><br><span style="color:var(--t2)">${esc(a.why)} (${a.agent})</span></p>`).join("")}</div>`:`<p class="sub" style="margin:0">Click a node for details.</p>`)+`</div>`}
function bindGraph(){document.querySelectorAll(".gn,.gt").forEach(x=>{const o=()=>{S.node=x.dataset.node;detail()};x.onclick=o;x.onkeydown=e=>e.key==="Enter"&&o()})}
function toast(m){const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),3500)}

async function newInc(){
 $("#m").innerHTML=`<h1>What happened?</h1><p class="sub">Tell AFTERSHOCK what happened in your own words.</p><textarea id="d" aria-label="Incident description" placeholder="My phone was stolen yesterday..."></textarea>
 <button class="btn" id="go">Analyze Incident →</button><div id="steps" class="mono" style="margin-top:16px;color:var(--t2)"></div><p class="err" id="e"></p>`;
 $("#go").onclick=async()=>{const d=$("#d").value.trim();if(!d)return $("#e").textContent="Please describe what happened.";$("#go").disabled=true;
  const st=["Understanding the event","Identifying affected areas","Checking risks","Researching required actions","Building recovery plan"];
  const show=n=>$("#steps").innerHTML=st.map((s,k)=>`<div>${k<n?"✓":k===n?"●":"○"} ${s}</div>`).join("");show(0);
  let n=0;const tm=setInterval(()=>show(Math.min(++n,4)),500);
  try{const c=await api("/incidents",{method:"POST",json:{description:d}});await api(`/incidents/${c.id}/analyze`,{method:"POST"});clearInterval(tm);S.inc=c.id;S.tab="dashboard";render()}
  catch(e){clearInterval(tm);$("#e").textContent=e.message;$("#go").disabled=false}}}

async function assets(){
 const l=await api("/assets");
 $("#m").innerHTML=`<h1>Assets</h1><p class="sub">Agents use these during incident analysis.</p><div class="card"><div class="row"><select id="k" style="width:auto"><option>Device</option><option>Vehicle</option><option>Document</option><option>Insurance</option><option>Financial Account</option></select><input id="n" aria-label="Asset name" placeholder="e.g. MacBook Pro" style="flex:1"><button class="btn" id="add">Add</button></div><p class="err" id="e"></p></div>`+
 (l.length?l.map(a=>`<div class="card"><span class="tag">${esc(a.kind)}</span> <b>${esc(a.name)}</b></div>`).join(""):`<div class="card">No assets yet.</div>`);
 $("#add").onclick=async()=>{try{await api("/assets",{method:"POST",json:{kind:$("#k").value,name:$("#n").value}});render()}catch(e){$("#e").textContent=e.message}}}

async function docs(){
 const l=await api("/documents");
 $("#m").innerHTML=`<h1>Documents</h1><p class="sub">Add documents so AFTERSHOCK can help when you need it. PDF, PNG, JPG, TXT.</p><div class="card"><input type="file" id="f" aria-label="Upload document"><p class="err" id="e"></p></div>`+
 (l.length?l.map(d=>`<div class="card"><b>${esc(d.name)}</b> <span class="tag">AI Indexed</span><div class="mono" style="color:var(--t2)">${esc(d.type)} ${Object.entries(d.extracted).filter(([k])=>k!=="document_type").map(([k,v])=>`· ${k}: ${esc(v)}`).join(" ")}</div></div>`).join(""):`<div class="card">Your recovery context starts here.</div>`);
 $("#f").onchange=async e=>{const fd=new FormData();fd.append("file",e.target.files[0]);try{await api("/documents",{method:"POST",body:fd});render()}catch(x){$("#e").textContent=x.message}}}

async function settings(){
 const s=await api("/settings");
 $("#m").innerHTML=`<h1>Settings</h1><p class="sub">AI CONTROL · <span class="tag">${s.mode}</span></p><div class="card">`+Object.entries(s.approval_rules).map(([k,v])=>`<label class="row" style="justify-content:space-between;padding:6px 0"><span>${label(k)[0].toUpperCase()+label(k).slice(1)}</span><input type="checkbox" style="width:auto;margin:0" data-k="${k}" ${v?"checked":""}> </label>`).join("")+`<p class="sub">AFTERSHOCK will never perform consequential actions without your approval.</p><p class="err" id="e"></p></div>`;
 document.querySelectorAll("[data-k]").forEach(c=>c.onchange=async()=>{try{await api("/settings",{method:"PUT",json:{[c.dataset.k]:c.checked}});toast("Saved")}catch(e){$("#e").textContent=e.message;c.checked=true}})}
render();
</script></body></html>
